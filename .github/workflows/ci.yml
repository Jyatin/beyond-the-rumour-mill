name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: brm_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://dev:devpassword@localhost:5432/brm_dev
      BETTER_AUTH_SECRET: supersecret_ci_key_for_testing_purposes_only

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          
      - name: Install dependencies
        run: npm ci

      - name: Setup Database (Migrate & Seed)
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Compiler
        run: npx tsc --noEmit

      - name: Run Integration Tests
        run: npm run test

      - name: Build Next.js
        run: npm run build
